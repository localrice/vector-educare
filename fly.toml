app = 'vector-educare-polished-smoke-9116'
primary_region = 'bom'

[build]

[env]
  FLASK_ENV = "production"

[mounts]
  source = "litefs_data"
  destination = "/var/lib/litefs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
